name: Publish ghstats snapshot

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Collect stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use tsx to run TypeScript directly
          npx tsx scripts/ghstats.ts > ghstats.json
          # Verify it's valid JSON
          jq -e '.v == 1 and (.prs | type == "array")' ghstats.json

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep the release stable; replace only the generated asset.
          gh release view ghstats-data >/dev/null 2>&1 || \
            gh release create ghstats-data \
              --title "GitHub Stats Snapshot" \
              --notes "Automatically refreshed GitHub statistics."
          gh release upload ghstats-data ghstats.json --clobber
